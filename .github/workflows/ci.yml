name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42ef56093747f60e29fb146a120fd15c463a # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a786727e0af36cf5cf6cff11e6970860 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.3

      - name: Run repository gate
        run: ./scripts/check.sh
