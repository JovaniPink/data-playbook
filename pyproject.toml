[project]
name = "data-playbook-archive-publisher"
version = "0.1.0"
description = "Bounded tar validation and create-only Cloud Storage publication"
requires-python = ">=3.14,<3.15"
dependencies = [
  "google-cloud-storage==3.13.1",
]

[dependency-groups]
dev = [
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.17.0",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
